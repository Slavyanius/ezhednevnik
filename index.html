<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc">
    <title>Ежедневник</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #f8fafc;
        }
        .tail-container {
            max-width: 428px;
            margin: 0 auto;
            background: white;
            min-height: 100dvh;
        }
        .entry-card {
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .entry-content {
            position: relative;
            z-index: 2;
            background: white;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .delete-btn {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            background: #ef4444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transform: translateX(100%);
            transition: transform 0.3s;
        }
        .entry-card.swiped .entry-content {
            transform: translateX(-80px);
        }
        .entry-card.swiped .delete-btn {
            transform: translateX(0);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-100">
    <div class="tail-container w-full flex flex-col h-screen overflow-hidden shadow-2xl">
        <!-- Header -->
        <div class="bg-white border-b px-6 pt-12 pb-4 flex items-center justify-between sticky top-0 z-50">
            <div>
                <h1 class="text-2xl font-semibold tracking-tighter text-slate-900">Ежедневник</h1>
                <p class="text-xs text-slate-500">Кинезиолог</p>
            </div>
            <button onclick="showAddModal()" 
                    class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg active:scale-95">
                <i class="fa-solid fa-plus text-2xl"></i>
            </button>
        </div>

        <div class="flex-1 overflow-auto p-4" id="entries-list"></div>

        <!-- Bottom Bar -->
        <div class="h-14 bg-white border-t flex items-center justify-around text-slate-400">
            <button class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-calendar-day text-xl"></i>
                <span class="text-[10px] mt-0.5">Записи</span>
            </button>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/60 flex items-end z-[100]">
        <div class="bg-white w-full rounded-t-3xl max-h-[90vh] overflow-hidden">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <button onclick="hideAddModal()" class="text-blue-600 font-medium">Отмена</button>
                <h2 class="font-semibold text-lg" id="modal-title">Новая запись</h2>
                <button onclick="saveEntry()" class="text-blue-600 font-semibold">Готово</button>
            </div>
            <div class="p-6 overflow-auto" style="max-height: calc(90vh - 140px)">
                <!-- Форма (оставлена как в первой версии) -->
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <div class="font-medium">Личная запись</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="is-personal" onchange="togglePersonal()" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:bg-blue-500"></div>
                    </label>
                </div>

                <div id="client-fields">
                    <input id="client-name" type="text" class="w-full bg-slate-100 rounded-2xl px-5 py-4 mb-4" placeholder="ФИО клиента">
                    <input id="client-phone" type="tel" class="w-full bg-slate-100 rounded-2xl px-5 py-4" placeholder="Телефон">
                </div>

                <div id="personal-fields" class="hidden">
                    <input id="personal-desc" type="text" class="w-full bg-slate-100 rounded-2xl px-5 py-4" placeholder="Описание">
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <input id="entry-date" type="date" class="bg-slate-100 rounded-2xl px-5 py-4">
                    <input id="entry-time" type="time" class="bg-slate-100 rounded-2xl px-5 py-4">
                </div>

                <button onclick="startVoiceInput()" 
                        class="mt-10 w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-medium py-5 rounded-3xl flex items-center justify-center gap-3">
                    <i class="fa-solid fa-microphone"></i>
                    <span>Надиктовать запись</span>
                </button>
                <p id="voice-status" class="text-center text-xs text-slate-400 mt-3"></p>
            </div>
        </div>
    </div>

    <script>
        let entries = [];

        function loadEntries() {
            const saved = localStorage.getItem('kinesiologEntries');
            entries = saved ? JSON.parse(saved) : [];
            renderEntries();
        }

        function saveEntries() {
            localStorage.setItem('kinesiologEntries', JSON.stringify(entries));
        }

        function renderEntries() {
            const container = document.getElementById('entries-list');
            container.innerHTML = '';

            const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

            let currentDate = '';
            sorted.forEach(entry => {
                if (entry.date !== currentDate) {
                    currentDate = entry.date;
                    container.innerHTML += `
                        <div class="text-xs font-semibold text-slate-500 px-2 mt-6 mb-2">
                            ${new Date(entry.date).toLocaleDateString('ru-RU', {weekday:'short', day:'numeric', month:'long'})}
                        </div>`;
                }

                const isPersonal = entry.isPersonal;
                const html = `
                    <div class="entry-card mb-3 rounded-3xl overflow-hidden shadow-sm border border-slate-100" data-id="${entry.id}">
                        <div class="delete-btn" onclick="deleteEntry('${entry.id}')">
                            Удалить
                        </div>
                        <div class="entry-content flex" ontouchstart="startSwipe(event)" ontouchmove="moveSwipe(event)" ontouchend="endSwipe(event)">
                            <div class="${isPersonal ? 'bg-slate-400' : 'bg-blue-500'} w-1.5"></div>
                            <div class="flex-1 px-5 py-4">
                                <div class="flex justify-between">
                                    <div class="flex-1">
                                        ${isPersonal ? 
                                            `<div class="font-medium text-slate-800">${entry.description || 'Личная запись'}</div>` :
                                            `<div class="font-medium">${entry.name}</div>
                                             <div class="text-sm text-slate-500">${entry.phone}</div>`
                                        }
                                    </div>
                                    <div class="text-right font-semibold text-lg text-slate-700">${entry.time}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += html;
            });
        }

        // Swipe logic
        let startX = 0;
        let currentCard = null;

        function startSwipe(e) {
            currentCard = e.currentTarget.parentElement;
            startX = e.touches[0].clientX;
            currentCard.classList.remove('swiped');
        }

        function moveSwipe(e) {
            if (!currentCard) return;
            const diff = startX - e.touches[0].clientX;
            if (diff > 50) {
                currentCard.classList.add('swiped');
            }
        }

        function endSwipe(e) {
            if (!currentCard) return;
            const diff = startX - e.changedTouches[0].clientX;
            if (diff > 120) {
                currentCard.classList.add('swiped');
            } else {
                currentCard.classList.remove('swiped');
            }
        }

        function deleteEntry(id) {
            if (confirm('Удалить эту запись?')) {
                entries = entries.filter(e => e.id !== id);
                saveEntries();
                renderEntries();
            }
        }

        // Остальные функции (showAddModal, saveEntry, voice и т.д.)
        function showAddModal() { /* ... оставь как в первой версии ... */ }
        function hideAddModal() { /* ... */ }
        function togglePersonal() { /* ... */ }
        function saveEntry() { /* ... */ }
        function startVoiceInput() { /* ... */ }
        function parseVoiceInput(text) { /* ... */ }

        // Инициализация
        window.onload = () => {
            loadEntries();
        };
    </script>
</body>
</html>
